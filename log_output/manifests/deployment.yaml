# Apply from the repository root:
#   kubectl apply -f log_output/manifests/deployment.yaml
# The log file is shared only by the writer and reader in this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: log-data
          emptyDir: {}
      containers:
        - name: log-writer
          image: log-output:2.1
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/writer.js
          env:
            - name: LOG_FILE
              value: /usr/src/app/files/log.txt
          volumeMounts:
            - name: log-data
              mountPath: /usr/src/app/files
        - name: log-reader
          image: log-output:2.1
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/reader.js
          env:
            - name: PORT
              value: '8080'
            - name: LOG_FILE
              value: /usr/src/app/files/log.txt
            - name: PING_PONG_URL
              value: http://ping-pong:8080/pings
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: log-data
              mountPath: /usr/src/app/files
              readOnly: true
