# Apply from the repository root:
#   kubectl apply -f log_output/manifests/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-log
          emptyDir: {}
      containers:
        - name: log-writer
          image: log-output:1.10
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/writer.js
          env:
            - name: LOG_FILE
              value: /usr/src/app/files/log.txt
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
        - name: log-reader
          image: log-output:1.10
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/reader.js
          env:
            - name: PORT
              value: '8080'
            - name: LOG_FILE
              value: /usr/src/app/files/log.txt
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
              readOnly: true
