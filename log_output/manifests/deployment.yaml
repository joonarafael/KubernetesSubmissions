# Apply from the repository root, after the shared volume manifests:
#   kubectl apply -f manifests/persistentvolume.yaml
#   kubectl apply -f manifests/persistentvolumeclaim.yaml
#   kubectl apply -f log_output/manifests/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data
      containers:
        - name: log-writer
          image: log-output:1.11
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/writer.js
          env:
            - name: LOG_FILE
              value: /usr/src/app/files/log.txt
          volumeMounts:
            - name: shared-data
              mountPath: /usr/src/app/files
        - name: log-reader
          image: log-output:1.11
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/reader.js
          env:
            - name: PORT
              value: '8080'
            - name: LOG_FILE
              value: /usr/src/app/files/log.txt
            - name: PING_FILE
              value: /usr/src/app/files/pings.txt
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: shared-data
              mountPath: /usr/src/app/files
              readOnly: true
