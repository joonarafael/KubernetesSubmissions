name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: CI Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log_output
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: log_output/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Format
        run: npm run fmt:check

      - name: Lint
        run: npm run lint
