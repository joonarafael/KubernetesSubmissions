# Apply from the repository root:
#   kubectl apply -f ping_pong/manifests/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: ping-pong:1.9
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: '8080'
          ports:
            - name: http
              containerPort: 8080
