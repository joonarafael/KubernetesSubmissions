# Claim for the shared log and ping-pong count, used by both deployments.
# Apply from the repository root:
#   kubectl apply -f manifests/persistentvolumeclaim.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-data
spec:
  storageClassName: shared-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
