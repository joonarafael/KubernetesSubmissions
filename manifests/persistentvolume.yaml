# Cluster-wide volume, kept apart from the applications.
# The directory must exist on the selected node before a pod mounts it:
#   docker exec k3d-k3s-default-agent-0 mkdir -p /tmp/kube
# Apply from the repository root:
#   kubectl apply -f manifests/persistentvolume.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-data
spec:
  storageClassName: shared-data
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  local:
    path: /tmp/kube
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-k3s-default-agent-0
