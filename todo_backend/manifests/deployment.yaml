# Apply from the repository root:
#   kubectl apply -f todo_backend/manifests/deployment.yaml
# The todo list is stored in memory, so this stays at one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: todo-backend:2.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: '8080'
          ports:
            - name: http
              containerPort: 8080
