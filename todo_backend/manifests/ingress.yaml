# Apply from the repository root:
#   kubectl apply -f todo_backend/manifests/ingress.yaml
# Priority is higher than the todo-app ingress so /todos is not handled by path /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-backend
  annotations:
    traefik.ingress.kubernetes.io/router.priority: '90'
spec:
  rules:
    - http:
        paths:
          - path: /todos
            pathType: Prefix
            backend:
              service:
                name: todo-backend
                port:
                  number: 8080
