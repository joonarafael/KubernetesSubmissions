# Apply from the repository root:
#   kubectl apply -f manifests/namespace.yaml
#   kubectl apply -f the_project/manifests/ingress.yaml
# /todos is served by the todo-backend ingress, which has a higher priority.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app
  namespace: project
  annotations:
    traefik.ingress.kubernetes.io/router.priority: '80'
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-app
                port:
                  number: 8080
