# Picture cache for the todo app. The directory must exist on the selected node:
#   docker exec k3d-k3s-default-agent-0 mkdir -p /tmp/kube-todo
# Apply from the repository root:
#   kubectl apply -f the_project/manifests/persistentvolume.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: todo-image
spec:
  storageClassName: todo-image
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  local:
    path: /tmp/kube-todo
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-k3s-default-agent-0
