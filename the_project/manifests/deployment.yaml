# Apply from the repository root, after the project volume manifests:
#   kubectl apply -f manifests/namespace.yaml
#   kubectl apply -f the_project/manifests/persistentvolume.yaml
#   kubectl apply -f the_project/manifests/persistentvolumeclaim.yaml
#   kubectl apply -f the_project/manifests/configmap.yaml
#   kubectl apply -f the_project/manifests/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: todo-image
          persistentVolumeClaim:
            claimName: todo-image
      containers:
        - name: todo-app
          image: todo-app:2.6
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: PORT
            - name: IMAGE_DIR
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: IMAGE_DIR
            - name: IMAGE_MAX_AGE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: IMAGE_MAX_AGE_SECONDS
            - name: PICTURE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: PICTURE_URL
            - name: TODO_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: TODO_BACKEND_URL
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: todo-image
              mountPath: /usr/src/app/files
