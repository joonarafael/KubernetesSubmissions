# Apply from the repository root:
#   kubectl apply -f the_project/manifests/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: todo-app
spec:
  type: NodePort
  selector:
    app: todo-app
  ports:
    - name: http
      nodePort: 30080
      protocol: TCP
      port: 8080
      targetPort: http
